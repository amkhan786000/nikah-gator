# Local development stack: docker compose up --build  ->  http://localhost:4200
services:
  mysql:
    image: mysql:8.0
    container_name: nikahgator-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-nikahgator}
      MYSQL_USER: ${DB_USER:-nikahgator}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nikahgatorpass}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: nikahgator-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-nikahgator}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:-nikahgator}
      DB_PASSWORD: ${DB_PASSWORD:-nikahgatorpass}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-before-deploying-to-production}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4200}
      # Local testing without SMTP: LOG_OTP=true prints sign-in codes in the backend log (never in production)
      LOG_OTP: ${LOG_OTP:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: nikahgator-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mysql-data:
  uploads:
