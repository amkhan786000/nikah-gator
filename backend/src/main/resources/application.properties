spring.application.name=nikah-gator-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3308/nikahgator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:nikahgator}
spring.datasource.password=${DB_PASSWORD:nikahgatorpass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# agents' features add migrations in parallel: allow a lower version to be applied after a higher one
spring.flyway.out-of-order=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret-dev-only}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# First platform admin on an empty database (ADMIN_EMAIL, else MAIL_USERNAME)
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrator}
app.site-url=${PUBLIC_URL:http://localhost:4200}
# Local testing only: print OTPs in the backend log. Never in production.
app.mail.log-otp=${LOG_OTP:false}

# "Remember this device": days a browser may skip the emailed sign-in code (0 = off)
app.remember-device-days=${REMEMBER_DEVICE_DAYS:30}

# Reminder e-mails: the job that sends due notifications (retries up to max-attempts with backoff)
app.reminders.enabled=${REMINDERS_ENABLED:true}
app.reminders.interval-ms=${REMINDERS_INTERVAL_MS:300000}
app.reminders.initial-delay-ms=${REMINDERS_INITIAL_DELAY_MS:30000}
app.reminders.max-attempts=${REMINDERS_MAX_ATTEMPTS:3}
