spring.application.name=nikah-gator-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3308/nikahgator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:nikahgator}
spring.datasource.password=${DB_PASSWORD:nikahgatorpass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret-dev-only}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# First platform admin on an empty database (ADMIN_EMAIL, else MAIL_USERNAME)
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrator}
app.site-url=${PUBLIC_URL:http://localhost:4200}
# Local testing only: print OTPs in the backend log. Never in production.
app.mail.log-otp=${LOG_OTP:false}
